name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Use canonical test temp directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The profile TEMP can use an 8.3 alias; resolve the job temp root.
          $testTemp = node -p "require('node:fs').realpathSync(process.env.RUNNER_TEMP)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve test temp directory' }
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package
